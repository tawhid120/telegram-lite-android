name: Build Android APK and Automated Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Test Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libmtdev1 libgl1-mesa-glx

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Pytest Suite with Virtual Display
        run: |
          xvfb-run -s "-screen 0 1024x768x24" pytest -v tests/

  build-apk:
    name: Build Android APK (Buildozer)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache git libncurses5 libstdc++6 zlib1g-dev libffi-dev libssl-dev zip unzip autoconf libtool pkg-config cmake

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Build Android Debug APK
        run: |
          buildozer -v android debug

      - name: Verify APK Exists & Non-Empty
        id: verify-apk
        run: |
          APK_FILE=$(find bin/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: No APK file was generated in bin/!"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_FILE")
          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK file is too small ($FILE_SIZE bytes)!"
            exit 1
          fi
          echo "Verified APK: $APK_FILE (Size: $FILE_SIZE bytes)"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_FILE)" >> $GITHUB_OUTPUT
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Lite-Android-APK
          path: bin/*.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [test, build-apk]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Telegram-Lite-Android-APK
          path: bin/

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v0.1.0"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Telegram Lite ${{ steps.vars.outputs.tag }} (Android Go)"
          draft: false
          prerelease: false
          files: bin/*.apk
          body: |
            ## 🚀 Telegram Lite for Android Go (${{ steps.vars.outputs.tag }})

            ### ✨ Key Features
            - **Direct MTProto Connection**: High-performance Telegram MTProto integration via Telethon.
            - **Official Telegram Auth**: Supports in-app service verification code (delivered to your active desktop/phone Telegram session), SMS fallback, and 2FA cloud password.
            - **Persistent Session Storage**: Secure session storage with Android Keystore encryption & auto-restoration.
            - **Four Chat Filter Tabs**: Instant in-memory filtering for **All**, **Personal**, **Groups**, and **Channels**.
            - **Custom Important Contacts**: Pin contacts (e.g. Contacts A, B, and C) simultaneously into a dedicated top carousel; saved in local SQLite independent of Telegram servers.
            - **Real Messaging**: Send/receive messages in real-time, message history pagination, reply banners, media previews.
            - **Low-RAM Optimization**: Built specifically for Android Go devices (1-2 GB RAM), featuring bounded memory/disk LRU caching and low-resource mode.

            ### 📲 Installation Instructions
            1. Download the attached `.apk` file below to your Android device.
            2. If prompted, allow **"Install unknown apps"** in Android Settings for your browser or file manager.
            3. Tap **Install** and open **Telegram Lite**.
            4. Enter your Telegram API credentials (from [my.telegram.org](https://my.telegram.org)) or use pre-configured environment credentials.
            5. Log in with your phone number and enter the verification code sent to your active Telegram device!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
