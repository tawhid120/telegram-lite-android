name: Build Official Telegram Android APK and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Signed Telegram APK
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        run: |
          echo "y" | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify Permanent Release Keystore
        run: |
          echo "=== Keystore Verification ==="
          keytool -list -v -keystore TMessagesProj/config/release.keystore -storepass android | grep -E "(Alias name|SHA256:)"

      - name: Build Standalone Fat Release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace --no-daemon

      - name: Locate and Verify Generated APK
        id: apk
        run: |
          APK_PATH=$(find TMessagesProj_AppStandalone/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          mkdir -p release_bin
          cp "$APK_PATH" release_bin/Telegram-v13.1.1-Standalone-Release.apk
          echo "apk_file=release_bin/Telegram-v13.1.1-Standalone-Release.apk" >> $GITHUB_OUTPUT
          
          echo "=== APK Signer Certificate Verification ==="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs release_bin/Telegram-v13.1.1-Standalone-Release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Official-Release-APK
          path: release_bin/*.apk

      - name: Determine Version Tag
        id: vars
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Attach Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Official Telegram Android ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          files: release_bin/*.apk
          body: |
            ## 🚀 Official Telegram Android (${{ steps.vars.outputs.tag }})

            Official Telegram Android v13.1.1 codebase with custom API credentials, seamless session verification login, and fixed permanent cryptographic signing.

            ### 🔑 Key Updates & Improvements
            - **Official Telegram Android Engine**: Switched fully to the official Telegram Android codebase (`https://github.com/DrKLO/Telegram.git`). All official features, UI, media handling, themes, voice/video calls, and chat folders are natively supported.
            - **Custom API ID & Hash Integration**: Pre-configured with custom Telegram Developer credentials (`API ID: 20193909`).
            - **In-App Verification Session Login**: Verification codes are received directly within your active Telegram sessions (Desktop, Web, or other mobile apps) without reliance on SMS carriers.
            - **Permanent Cryptographic Signature**: Built and signed with a permanent, fixed release keystore certificate (`SHA-256: A0:8D:7D:C3:23:DD:F7:1E:F3:20:19:44:39:7E:0D:3C:CE:7D:40:84:72:63:E1:1F:32:8B:68:BB:E1:92:29:AB`). Upgrades and future releases will always install cleanly without `INSTALL_FAILED_UPDATE_INCOMPATIBLE` signature mismatch errors.

            ### 📲 Installation Instructions
            1. Download the attached `.apk` file below.
            2. If updating from a previous version signed with an ephemeral debug signature, uninstall the previous version once. All future updates using this permanent keystore can be upgraded directly!
            3. Open the app, enter your phone number, and enter the verification code sent to your active Telegram device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
